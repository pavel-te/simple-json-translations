name: Translate
on:
  push:
    branches: [main]
    # SOURCE files only. This is the loop guard: a commit that only touches
    # translated output can never start another translation run.
    paths:
      - 'locales/en.json'
      - 'locales/admins-en.json'
      - 'root.en.json'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: OnTheGoSystems/ptc-action@v1
        with:
          api-token: ${{ secrets.PTC_API_TOKEN }}
          # This project deliberately has no .ptc-config.yml — it demonstrates
          # the pattern form. `{{lang}}` marks the language slot;
          # ignore-this-en.json sits at the root and matches neither pattern,
          # so it stays untranslated.
          source-locale: en
          patterns: 'locales/*{{lang}}.json,root.{{lang}}.json'
          create-pr: true
